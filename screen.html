<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bristol Junior Open · hall screen</title>
<meta name="description" content="Big-screen display for the playing hall: current pairings one section at a time, next-round time and the latest announcement. Reads data/live.json like the parents' page.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Everything scales with the screen height, so 1080p and 4K look the same. 1rem ≈ 20px at 1080. */
  :root {
    --bg: #070709; --ink: #F4F4F8; --muted: #B9B8C9; --line: #24242e; --panel: #101016;
    --cyan: #16C7FF; --gold: #F2C24E;
    --u8: #19D6A6; --u10: #FF7A45; --u12: #A07BFF;
    --live: #16C7FF; --stale: #FF7A45;
  }
  * { box-sizing: border-box; }
  html { font-size: 1.85vh; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); cursor: none; }
  body { font: 1rem/1.3 'Plus Jakarta Sans', system-ui, sans-serif; display: grid; grid-template-rows: auto 1fr auto; padding: 1.6rem 2.4rem 1.4rem; gap: 1rem; }
  .sora { font-family: Sora, 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 800; letter-spacing: -.02em; }

  /* top bar */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 2rem; }
  .brand { display: flex; align-items: center; gap: 1.2rem; }
  .brand img { height: 2.2rem; width: auto; display: block; }
  .brand .event { font-weight: 600; font-size: 1.2rem; color: var(--muted); }
  .chip { display: inline-flex; align-items: center; gap: .5rem; background: var(--cyan); color: #070709; font-weight: 700; font-size: .95rem; padding: .25rem .8rem; border-radius: 999px; letter-spacing: .04em; text-transform: uppercase; }
  .chip::before { content: ''; width: .6rem; height: .6rem; border-radius: 50%; background: #070709; animation: blink 1.6s infinite; }
  .chip.stale { background: var(--stale); }
  .chip.stale::before { animation: none; }
  @keyframes blink { 50% { opacity: .25; } }
  .clock { text-align: right; }
  .clock .time { font-size: 2.6rem; line-height: 1; }
  .clock .updated { color: var(--muted); font-size: .95rem; margin-top: .2rem; }

  /* main slide */
  .slide { display: grid; grid-template-rows: auto 1fr; gap: .8rem; min-height: 0; animation: fade .5s ease; }
  .slide > table, .slide > .cols { align-self: start; }
  /* density: few boards get bigger type, many boards get tighter rows */
  .slide.roomy table { font-size: 2.4rem; } .slide.roomy td { padding: .7rem .6rem; } .slide.roomy .bd { font-size: 2.8rem; }
  .slide.tight table { font-size: 1.75rem; } .slide.tight td { padding: .3rem .6rem; } .slide.tight .bd { font-size: 2rem; }
  @keyframes fade { from { opacity: 0; transform: translateY(.4rem); } }
  .head { display: flex; align-items: baseline; gap: 1.2rem; }
  .sec { font-size: 3.4rem; line-height: 1; padding: .1em .45em; border-radius: .9rem; color: #070709; }
  .sec { background: var(--cyan); }
  .sec.u8 { background: var(--u8); } .sec.u10 { background: var(--u10); } .sec.u12 { background: var(--u12); }
  .title { font-size: 2.6rem; line-height: 1; }
  .sub { color: var(--muted); font-size: 1.3rem; margin-left: auto; align-self: center; }
  table { width: 100%; border-collapse: collapse; font-size: 1.95rem; line-height: 1.15; table-layout: fixed; }
  th { text-align: left; color: var(--muted); font-size: .95rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; padding: 0 .6rem .4rem; border-bottom: 2px solid var(--line); }
  th:first-child, td:first-child { padding-left: 0; }
  th.bd, th.rank, th.res, th.pts { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: .95rem; font-weight: 600; color: var(--muted); }
  th.w { text-align: right; }
  td { padding: .42rem .6rem; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bd { width: 6.5rem; font-family: Sora, sans-serif; font-weight: 800; font-size: 2.3rem; color: var(--muted); text-align: left; }
  .w { text-align: right; }
  .res { width: 13rem; text-align: center; padding-left: 1.4rem; padding-right: 1.4rem; font-family: Sora, sans-serif; font-weight: 800; font-variant-numeric: tabular-nums; }
  .res .live { display: inline-block; width: 1.6rem; height: .55rem; border-radius: 999px; background: var(--line); }
  .pts { width: 6rem; text-align: right !important; font-family: Sora, sans-serif; font-weight: 800; }
  .rank { width: 6.5rem; color: var(--muted); font-family: Sora, sans-serif; font-weight: 800; text-align: left; }
  .rank.r1 { color: var(--gold); } .rank.r2 { color: var(--cyan); } .rank.r3 { color: #D08A4B; }
  .bye { color: var(--muted); font-style: italic; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 3rem; align-content: start; }
  .big { display: grid; place-items: center; text-align: center; gap: 1rem; }
  .big .h { font-size: 4.2rem; line-height: 1.05; max-width: 80vw; }
  .big .h mark { background: var(--cyan); color: #070709; padding: 0 .25em; border-radius: .2em; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .big .p { color: var(--muted); font-size: 1.8rem; max-width: 70vw; }
  .big .arrived { font-size: 2rem; color: var(--ink); margin-top: 1rem; }

  /* countdown slide */
  .count { display: grid; place-items: center; text-align: center; gap: .6rem; }
  .count .digits { font-family: Sora, sans-serif; font-weight: 800; font-size: 13rem; line-height: 1; letter-spacing: -.04em; color: var(--gold); font-variant-numeric: tabular-nums; }
  .count .digits.now { color: var(--cyan); font-size: 7rem; }
  .count .what { font-family: Sora, sans-serif; font-weight: 800; font-size: 3rem; }
  .count .where { color: var(--muted); font-size: 1.8rem; }

  /* chess interlude */
  .lesson { display: grid; grid-template-columns: auto 1fr; gap: 3.2rem; min-height: 0; height: 100%; animation: fade .5s ease; }
  .ls-board { --side: calc(100vh - 17.5rem); width: var(--side); height: var(--side); }
  .ls-boardbox { width: var(--side); height: var(--side); }
  .cb { position: relative; width: 100%; height: 100%; border-radius: .6rem; overflow: hidden; box-shadow: 0 0 0 .35rem #1a1a22; }
  .cb-squares { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); }
  .cb-sq { position: relative; } .cb-sq.light { background: #EDE7D6; } .cb-sq.dark { background: #5B7A99; }
  .cb-sq.hi.light { background: #F5E39A; } .cb-sq.hi.dark { background: #C9A64A; }
  .cb-sq[data-file]::after, .cb-sq[data-rank]::before { position: absolute; font-size: .85rem; font-weight: 700; opacity: .55; }
  .cb-sq[data-file]::after { content: attr(data-file); right: .3rem; bottom: .1rem; } .cb-sq[data-rank]::before { content: attr(data-rank); left: .3rem; top: .1rem; }
  .cb-sq.light::after, .cb-sq.light::before { color: #5B7A99; } .cb-sq.dark::after, .cb-sq.dark::before { color: #EDE7D6; }
  .cb-pieces { position: absolute; inset: 0; pointer-events: none; }
  .cb-piece { position: absolute; left: 0; top: 0; width: 12.5%; height: 12.5%; transition: transform .65s cubic-bezier(.2,.7,.2,1), opacity .4s; padding: .45%; box-sizing: border-box; }
  .cb-piece svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 .15rem .2rem rgba(0,0,0,.35)); }
  .cb-piece.gone { opacity: 0; transform: scale(.6) !important; }
  .ls-side { display: grid; grid-template-rows: auto auto auto auto 1fr; gap: .8rem; min-width: 0; align-content: start; }
  .ls-kicker { color: var(--cyan); font-weight: 700; text-transform: uppercase; letter-spacing: .1em; font-size: 1rem; }
  .ls-title { font-family: Sora, sans-serif; font-weight: 800; font-size: 3.2rem; line-height: 1.05; letter-spacing: -.02em; }
  .ls-sub { color: var(--muted); font-size: 1.4rem; }
  .ls-moves { display: flex; flex-wrap: wrap; gap: .4rem .9rem; font-family: Sora, sans-serif; font-weight: 600; font-size: 1.5rem; color: var(--muted); min-height: 2.2rem; margin-top: .6rem; }
  .ls-moves .cur { color: #070709; background: var(--gold); padding: 0 .5rem; border-radius: .4rem; }
  .ls-note { font-size: 2rem; line-height: 1.35; margin-top: 1rem; align-self: start; }
  .ls-note.intro, .ls-note.outro { font-size: 2.1rem; color: var(--ink); border-left: .4rem solid var(--cyan); padding-left: 1.2rem; }

  /* other tournaments */
  .promo { display: grid; grid-template-rows: auto 1fr; gap: 1.2rem; min-height: 0; animation: fade .5s ease; }
  .promo .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.6rem; align-content: start; }
  .promo .card { background: var(--panel); border-radius: 1.2rem; padding: 1.6rem 1.8rem; border-top: .6rem solid var(--cyan); display: grid; gap: .7rem; align-content: start; min-height: 0; transition: transform .4s, box-shadow .4s; }
  .promo .card.on { transform: scale(1.03); box-shadow: 0 0 0 .25rem var(--card-colour); }
  .promo .club { color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: .95rem; }
  .promo .ttl { font-family: Sora, sans-serif; font-weight: 800; font-size: 2.1rem; line-height: 1.1; letter-spacing: -.02em; }
  .promo .when { font-family: Sora, sans-serif; font-weight: 600; font-size: 1.35rem; color: var(--gold); }
  .promo .where { font-size: 1.2rem; color: var(--muted); }
  .promo ul { margin: .4rem 0 0; padding-left: 1.2rem; font-size: 1.25rem; line-height: 1.35; } .promo li { margin-bottom: .4rem; }
  .promo .enter { margin-top: .6rem; font-size: 1.15rem; } .promo .enter b { font-family: Sora, sans-serif; }
  .promo .foot-line { color: var(--muted); font-size: 1.3rem; text-align: center; }

  /* golden tickets */
  .tickets { display: grid; grid-template-rows: auto 1fr auto; gap: 1rem; min-height: 0; animation: fade .5s ease; }
  .tickets .cols3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.6rem; align-content: start; min-height: 0; }
  .tickets .col { display: grid; gap: .5rem; align-content: start; }
  .tickets .col .sec { justify-self: start; font-size: 2rem; }
  .tickets .name { font-family: Sora, sans-serif; font-weight: 800; font-size: 1.9rem; line-height: 1.15; display: flex; justify-content: space-between; gap: 1rem; align-items: baseline; border-bottom: 1px solid var(--line); padding: .3rem 0; }
  .tickets .name small { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 1.05rem; color: var(--gold); white-space: nowrap; }
  .tickets .name.lit { color: var(--gold); }
  .tickets .none { color: var(--muted); font-size: 1.3rem; }
  .tickets .collect { background: var(--gold); color: #070709; border-radius: 1rem; padding: 1rem 1.6rem; font-family: Sora, sans-serif; font-weight: 800; font-size: 1.9rem; text-align: center; }
  .tickets .collect small { display: block; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 1.2rem; margin-top: .2rem; }

  /* bottom bar */
  .bottom { display: grid; grid-template-columns: 27rem 1fr 24rem; gap: 2.4rem; align-items: center; border-top: 2px solid var(--line); padding-top: 1rem; min-height: 5rem; }
  .next { display: flex; align-items: baseline; gap: .9rem; white-space: nowrap; overflow: hidden; }
  .next > * { flex-shrink: 0; }
  .next .t { font-size: 3.2rem; line-height: 1; color: var(--gold); font-variant-numeric: tabular-nums; min-width: 8.2rem; }
  .next .t.now { font-size: 2rem; color: var(--cyan); }
  .next .l { color: var(--muted); font-size: 1.2rem; }
  .ann { border-left: .4rem solid var(--cyan); padding-left: 1rem; font-family: Sora, sans-serif; font-weight: 800; font-size: 1.7rem; line-height: 1.2; letter-spacing: -.01em; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .ann time { display: block; color: var(--muted); font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 500; font-size: .95rem; }
  .ann.empty { border-color: var(--line); color: var(--muted); }
  .dots { display: flex; gap: .5rem; }
  .dots span { width: 1rem; height: 1rem; border-radius: 50%; background: var(--line); }
  .dots span.on.u8 { background: var(--u8); } .dots span.on.u10 { background: var(--u10); } .dots span.on.u12 { background: var(--u12); }
  .dots span.on { background: var(--ink); }
  .foot { color: var(--muted); font-size: .9rem; text-align: right; }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><img src="img/logo-cyan.png" alt="blundr"><span class="event" id="event-name">Bristol Junior Open</span><span class="chip" id="chip">Live</span></div>
  <div class="clock"><div class="time sora" id="now">--:--</div><div class="updated" id="updated">Loading…</div></div>
</header>

<main id="slide" class="slide"></main>

<footer class="bottom">
  <div class="next" id="next"></div>
  <div class="ann empty" id="ann">Announcements from the desk appear here.</div>
  <div><div class="dots" id="dots"></div><div class="foot" id="foot"></div></div>
</footer>

<script src="pieces.js"></script>
<script src="lessons.js"></script>
<script src="promos.js"></script>
<script src="chessboard.js"></script>
<script>
(() => {
  // ?secs=10 dwell per slide · ?section=u12 pin one section · ?rows=12 rows per page
  const params = new URLSearchParams(location.search);
  const DWELL = Math.max(4, Number(params.get('secs')) || 10) * 1000;
  const PIN = params.get('section');
  const ROWS = Math.max(6, Number(params.get('rows')) || 12);
  const LOCAL_URL = 'data/live.json', PUBLIC_URL = 'https://factandstory.github.io/blundr-live/data/live.json';
  let DATA_URL = LOCAL_URL; // if the iMac stops answering (Wi-Fi isolation, iMac asleep), fall back to the public copy and keep trying the iMac now and then
  const REFRESH_MS = /github\.io$/.test(location.hostname) ? 15000 : 4000;   // on the iMac the data is local, so poll fast: desk pushes land within 4 s

  const $ = s => document.querySelector(s);
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) { if (k === 'class') n.className = v; else if (v !== null && v !== undefined) n.setAttribute(k, v); }
    for (const k of kids.flat()) if (k !== null && k !== undefined) n.append(k.nodeType ? k : document.createTextNode(String(k)));
    return n;
  };
  const clean = s => (s || '').replace(/\s+\.$/, '').trim();
  const fmtTime = iso => new Date(iso).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  const res = r => r ? r.split('1/2').join('½').replace('-', '–') : null;

  let data = null, failures = 0, slides = [], idx = -1, timer = null;
  // next round: desk setting first, printed timetable as fallback. Returns { number, at: Date, label, note } or null
  function nextRound() {
    const today = (hm) => { const [h, m] = hm.split(':').map(Number); const d = new Date(); d.setHours(h, m, 0, 0); return d; };
    const nr = data.nextRound;
    if (nr && nr.startsAt && today(nr.startsAt).getTime() > Date.now() - 10 * 60000) return { number: nr.number, at: today(nr.startsAt), label: nr.startsAt, note: nr.note || '' };
    const sch = (data.schedule && data.schedule.rounds) || {}; const now = Date.now();
    for (const [n, t] of Object.entries(sch)) { const at = today(t); if (at.getTime() > now - 3 * 60000) return { number: Number(n), at, label: t, note: '' }; }
    if (data.schedule && data.schedule.prizes) { const at = today(data.schedule.prizes); if (at.getTime() > now - 3 * 60000) return { number: null, at, label: data.schedule.prizes, note: 'Prize-giving' }; }
    return null;
  }
  const mmss = ms => { const s = Math.max(0, Math.round(ms / 1000)); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60; return (h ? h + ':' : '') + String(m).padStart(h ? 2 : 1, '0') + ':' + String(x).padStart(2, '0'); };

  async function load() {
    try {
      const r = await fetch(`${DATA_URL}?t=${Date.now()}`, { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
      data = await r.json(); failures = 0;
      renderChrome(); buildSlides();
      if (featureActive()) startLesson(); else if (lessonView) { stopLesson(); } else if (idx < 0) step(); else showSlide(idx, false);
    } catch (e) {
      failures++;
      if (failures >= 1 && DATA_URL === LOCAL_URL && !/github\.io$/.test(location.hostname)) { DATA_URL = PUBLIC_URL; failures = 0; $('#updated').textContent = 'Desk unreachable; using the public copy'; return load(); }
      if (failures >= 2) { $('#updated').textContent = data ? 'Connection lost. Showing the last update.' : 'Waiting for data…'; $('#chip').classList.add('stale'); }
    }
  }

  // ---- slides: one per section (paged if long); a standings slide once a round's results are all in
  function buildSlides() {
    const out = [];
    const secs = Object.values(data.sections).filter(s => !PIN || s.slug === PIN);
    for (const sec of secs) {
      if (!sec.currentRound) { out.push({ sec, kind: 'waiting' }); continue; }
      const rows = sec.rounds[sec.currentRound] || [];
      const complete = sec.progress && sec.progress.boards > 0 && sec.progress.entered >= sec.progress.boards;
      const paged = [];
      for (let i = 0; i < rows.length; i += ROWS * 2) paged.push(rows.slice(i, i + ROWS * 2));
      if (!paged.length) paged.push([]);
      paged.forEach((rows, i) => out.push({ sec, kind: 'pairings', rows, page: i + 1, pages: paged.length, complete }));
      if (sec.standings.length) out.push({ sec, kind: 'standings', complete });
    }
    const nr = nextRound();
    if (nr && nr.at.getTime() - Date.now() > -2 * 60000) out.unshift({ kind: 'countdown', sec: { slug: 'clock' } });
    slides = out;
    if (idx >= slides.length) idx = 0;
  }

  // ---- desk-pushed interlude (a chess lesson) takes over the main area, then the rotation returns by itself
  let lessonView = null, lessonKey = null, lessonStart = 0, lessonFeature = null; const lessonDone = new Set();
  function featureActive() {
    const f = data && data.feature; if (!f) return null;
    const key = f.id || f.startedAt; if (lessonDone.has(key)) return null;
    if (f.kind === 'lesson') { if (!window.LESSONS || !window.Chess) return null; const L = window.LESSONS.find(l => l.id === f.lesson); if (!L) return null; return { f, L, key }; }
    if (f.kind === 'promo' && window.PROMOS) return { f, key };
    if (f.kind === 'tickets') return { f, key };
    return null;
  }
  function startLesson() {
    const a = featureActive(); if (!a || a.key === lessonKey) return;
    clearTimeout(timer); lessonKey = a.key; lessonFeature = a.f; lessonStart = Date.parse(a.f.startedAt) || Date.now();
    const main = $('#slide'); main.className = 'slide'; $('#dots').replaceChildren();
    if (a.f.kind === 'lesson') { const host = el('div', { class: 'lesson' }); main.replaceChildren(host); lessonView = window.Chess.mountLesson(host, a.L); lessonView.tick(Date.now() - lessonStart); }
    else if (a.f.kind === 'promo') { lessonView = mountPromo(main); }
    else if (a.f.kind === 'tickets') { lessonView = mountTickets(main); }
  }
  function stopLesson() { lessonView = null; lessonKey = null; lessonFeature = null; idx = -1; step(); }
  function lessonTick() {
    if (!lessonView) return;
    let e = Date.now() - lessonStart;
    if (lessonView.refresh) lessonView.refresh();   // promo/tickets re-read live data each tick
    if (e >= lessonView.total) { if (lessonFeature.loop) e = e % lessonView.total; else { lessonDone.add(lessonKey); stopLesson(); return; } }
    lessonView.tick(e);
  }

  // ---- other tournaments: three cards, one lit at a time
  function mountPromo(main) {
    const P = window.PROMOS; const DWELL_CARD = 9000;
    const cards = P.map(p => el('div', { class: 'card', style: `border-top-color:${p.colour}; --card-colour:${p.colour}` },
      el('div', { class: 'club' }, p.club), el('div', { class: 'ttl' }, p.title), el('div', { class: 'when' }, p.when), el('div', { class: 'where' }, p.where),
      el('ul', {}, ...p.facts.map(f => el('li', {}, f))),
      el('div', { class: 'enter' }, 'Enter at ', el('b', {}, p.enter), ' · ', p.contact)));
    const host = el('div', { class: 'promo' },
      el('div', { class: 'head' }, el('span', { class: 'sec sora', style: 'background:var(--gold)' }, 'Coming up'), el('span', { class: 'title sora' }, 'Three more tournaments for your diary'), el('span', { class: 'sub' }, 'details from the organisers')),
      el('div', { class: 'cards' }, ...cards));
    main.replaceChildren(host);
    let lit = -1;
    return { total: DWELL_CARD * P.length, tick(e) { const i = Math.floor(e / DWELL_CARD) % P.length; if (i !== lit) { lit = i; cards.forEach((c, k) => c.classList.toggle('on', k === i)); } } };
  }

  // ---- Golden Tickets: qualifiers so far from the standings and the LJCC pass marks in live.json
  function qualifiers() {
    const out = [];
    for (const sec of Object.values(data.sections)) {
      const q = (data.qualify || {})[sec.slug]; if (!q) continue;
      const rows = (sec.standings || []).map(s => ({ name: clean(s.name), score: Number(String(s.score || '').replace('½', '.5').replace(',', '.')) || 0 })).filter(s => s.name);
      const list = rows.map(s => {
        if (q.final != null) return s.score >= q.final ? { ...s, label: 'Final' } : null;
        if (q.major != null && s.score >= q.major) return { ...s, label: 'Major' };
        if (q.minor != null && s.score >= q.minor) return { ...s, label: 'Minor' };
        return null;
      }).filter(Boolean);
      const done = sec.progress && sec.progress.boards > 0 && sec.progress.entered >= sec.progress.boards && sec.currentRound === (sec.totalRounds || 6);
      out.push({ sec, q, list, done });
    }
    return out;
  }
  function mountTickets(main) {
    const prizes = (data.schedule && data.schedule.prizes) || '17:45';
    const host = el('div', { class: 'tickets' });
    main.replaceChildren(host);
    let last = ''; let lit = -1; const PER = 2500;
    const build = () => {
      const qs = qualifiers(); const sig = JSON.stringify(qs.map(x => [x.sec.slug, x.list.map(l => l.name + l.score), x.done]));
      if (sig === last) return; last = sig;
      const allDone = qs.length && qs.every(x => x.done);
      host.replaceChildren(
        el('div', { class: 'head' }, el('span', { class: 'sec sora', style: 'background:var(--gold)' }, 'Golden Tickets'), el('span', { class: 'title sora' }, allDone ? 'Qualified for the London Junior Chess Championships' : 'On course for London so far'), el('span', { class: 'sub' }, allDone ? 'final' : 'standings still moving')),
        el('div', { class: 'cols3' }, ...qs.map(x => el('div', { class: 'col' },
          el('span', { class: `sec sora ${x.sec.slug}` }, x.sec.name),
          ...(x.list.length ? x.list.map(l => el('div', { class: 'name', 'data-n': l.name }, el('span', {}, l.name), el('small', {}, `${String(l.score).replace('.5', '½')} pts · ${l.label}`))) : [el('div', { class: 'none' }, x.q.final != null ? `${x.q.final} points needed` : `${x.q.minor} for the Minor, ${x.q.major} for the Major`)])))),
        el('div', { class: 'collect' }, `Collect your Golden Ticket at the prize-giving, ${prizes}, in the village hall`, el('small', {}, 'Trophies and medals are presented at the same time. Everyone welcome.')));
    };
    build();
    return { total: 60000, refresh: build, tick(e) { const names = host.querySelectorAll('.name'); if (!names.length) return; const i = Math.floor(e / PER) % names.length; if (i !== lit) { lit = i; names.forEach((n, k) => n.classList.toggle('lit', k === i)); } } };
  }

  function step() {
    if (!slides.length) return;
    idx = (idx + 1) % slides.length;
    showSlide(idx, true);
    clearTimeout(timer); timer = setTimeout(step, DWELL);
  }

  function showSlide(i, animate) {
    const s = slides[i]; if (!s) return;
    const main = $('#slide');
    main.replaceChildren(...slideNodes(s));
    const n = s.kind === 'pairings' ? s.rows.length : s.kind === 'standings' ? Math.ceil(s.sec.standings.length / 2) : 0;
    main.className = 'slide ' + (n && n <= 7 ? 'roomy' : n >= 10 ? 'tight' : '');
    if (animate) { main.style.animation = 'none'; void main.offsetWidth; main.style.animation = ''; }
    const dots = $('#dots'); dots.replaceChildren();
    slides.forEach((x, j) => dots.append(el('span', { class: (j === i ? 'on ' : '') + x.sec.slug })));
  }

  function slideNodes(s) {
    const sec = s.sec;
    const head = (title, sub) => el('div', { class: 'head' }, el('span', { class: `sec sora ${sec.slug}` }, sec.name), el('span', { class: 'title sora' }, title), sub ? el('span', { class: 'sub' }, sub) : null);

    if (s.kind === 'countdown') {
      const nr = nextRound(); if (!nr) return [el('div', { class: 'count' }, el('div', { class: 'what' }, 'Next round soon'))];
      const what = nr.number ? `Round ${nr.number} starts at ${nr.label}` : `${nr.note || 'Next'} at ${nr.label}`;
      return [el('div', { class: 'count' }, el('div', { class: 'digits', id: 'cd' }, mmss(nr.at - Date.now())), el('div', { class: 'what' }, what), el('div', { class: 'where' }, nr.note && nr.number ? nr.note : 'Players to the Pavilion five minutes before. Parents stay in the Village Hall.'))];
    }
    if (s.kind === 'waiting') {
      const r1 = data.schedule && data.schedule.rounds && data.schedule.rounds['1'];
      const ci = data.checkin;
      const here = ci && ci.arrived ? ci.arrived.filter(a => a.section === sec.slug).length : null;
      const total = (data.roster || []).filter(p => p.section === sec.slug).length;
      return [head('Round 1', r1 ? `pairings at ${r1}` : ''), el('div', { class: 'big' },
        el('div', { class: 'h sora' }, 'Welcome to the ', el('mark', {}, 'Bristol Junior Open')),
        el('div', { class: 'p' }, `${sec.name} pairings appear here as soon as the arbiter publishes them. Find your board number, then sit at that board: White on the left of the number as you face it.`),
        here !== null && total ? el('div', { class: 'arrived sora' }, `${here} of ${total} checked in`) : null)];
    }

    if (s.kind === 'standings') {
      const rows = sec.standings;
      const half = Math.ceil(rows.length / 2);
      const table = list => { const t = el('table', {}, el('thead', {}, el('tr', {}, el('th', { class: 'rank' }, 'Rank'), el('th', {}, 'Player'), el('th', { class: 'pts' }, 'Pts')))); const tb = el('tbody'); for (const r of list) { const n = Number(r.rank); tb.append(el('tr', {}, el('td', { class: 'rank' + (n >= 1 && n <= 3 ? ' r' + n : '') }, r.rank), el('td', {}, clean(r.name)), el('td', { class: 'pts' }, r.score ?? ''))); } t.append(tb); return t; };
      const sub = s.complete ? `after round ${sec.currentRound} of ${sec.totalRounds || 6}` : sec.progress ? `round ${sec.currentRound} in play · ${sec.progress.entered} of ${sec.progress.boards} results in` : `round ${sec.currentRound} in play`;
      return [head('Standings', sub), el('div', { class: 'cols' }, table(rows.slice(0, half)), table(rows.slice(half)))];
    }

    // pairings
    const sub = s.complete ? `all results in` : s.pages > 1 ? `boards ${s.rows[0]?.board}–${s.rows[s.rows.length - 1]?.board}` : sec.progress ? `${sec.progress.entered} of ${sec.progress.boards} results in` : '';
    const table = list => {
      const t = el('table', {}, el('thead', {}, el('tr', {}, el('th', { class: 'bd' }, 'Board'), el('th', { class: 'w' }, 'White'), el('th', { class: 'res' }, 'Result'), el('th', {}, 'Black'))));
      const tb = el('tbody');
      for (const r of list) {
        const bye = !r.black || /^bye$/i.test(clean(r.black)) || !r.white || /^bye$/i.test(clean(r.white));
        tb.append(el('tr', {},
          el('td', { class: 'bd' }, r.board ?? ''),
          el('td', { class: 'w' + (bye && !clean(r.white) ? ' bye' : '') }, clean(r.white) || 'bye'),
          el('td', { class: 'res' }, r.result ? res(r.result) : bye ? '' : el('span', { class: 'live' })),
          el('td', { class: bye && !clean(r.black) ? 'bye' : '' }, clean(r.black) || 'bye')));
      }
      t.append(tb); return t;
    };
    const rows = s.rows;
    if (!rows.length) return [head(`Round ${sec.currentRound}`, sub), el('div', { class: 'big' }, el('div', { class: 'p' }, 'Pairings are being published. One moment.'))];
    if (rows.length <= ROWS) return [head(`Round ${sec.currentRound}`, sub), table(rows)];
    const half = Math.ceil(rows.length / 2);
    return [head(`Round ${sec.currentRound}`, sub), el('div', { class: 'cols' }, table(rows.slice(0, half)), table(rows.slice(half)))];
  }

  // ---- top and bottom bars
  function renderChrome() {
    $('#event-name').textContent = data.event.name;
    const gen = new Date(data.generatedAt);
    const ageMin = (Date.now() - gen) / 60000;
    const age = ageMin > 90 ? `${Math.round(ageMin / 60)} h ago` : `${Math.round(ageMin)} min ago`;
    $('#updated').textContent = `Updated ${fmtTime(data.generatedAt)}` + (ageMin > 5 ? ` · ${age}` : '');
    $('#chip').classList.toggle('stale', ageMin > 5);

    const nx = $('#next'); nx.replaceChildren();
    const nr = nextRound();
    if (nr) nx.append(el('span', { class: 't sora', id: 'cdbar' }, mmss(nr.at - Date.now())), el('span', { class: 'l', id: 'cdlabel' }, nr.number ? `until round ${nr.number} at ${nr.label}` : `until ${(nr.note || 'next').toLowerCase()} at ${nr.label}`));
    else nx.append(el('span', { class: 'l' }, 'Next round time appears here.'));

    const a = (data.announcements || []).slice(-1)[0];
    const ann = $('#ann');
    if (a) { ann.className = 'ann'; ann.replaceChildren(el('time', {}, `From the desk · ${fmtTime(a.at)}`), document.createTextNode(a.text)); }
    else { ann.className = 'ann empty'; ann.textContent = 'Announcements from the desk appear here.'; }
    $('#foot').textContent = 'Full results on your phone: factandstory.github.io/blundr-live';
  }

  function tick() {
    lessonTick();
    $('#now').textContent = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    if (!data) return; const nr = nextRound(); const left = nr ? nr.at.getTime() - Date.now() : null;
    const cd = $('#cd'); if (cd && nr) { if (left > 0) { cd.textContent = mmss(left); cd.classList.remove('now'); } else { cd.textContent = nr.number ? `Round ${nr.number} is starting` : 'Starting now'; cd.classList.add('now'); } }
    const bar = $('#cdbar'), lab = $('#cdlabel'); if (bar && nr) { if (left > 0) { bar.textContent = mmss(left); bar.classList.remove('now'); if (lab) lab.hidden = false; } else { bar.textContent = nr.number ? `Round ${nr.number} starting` : 'Starting now'; bar.classList.add('now'); if (lab) lab.hidden = true; } }
  }
  tick(); setInterval(tick, 1000);
  load(); setInterval(load, REFRESH_MS);
  setInterval(async () => { if (DATA_URL !== PUBLIC_URL) return; try { const r = await fetch(`${LOCAL_URL}?t=${Date.now()}`, { cache: 'no-store' }); if (r.ok) { DATA_URL = LOCAL_URL; failures = 0; } } catch {} }, 120000);
  document.addEventListener('keydown', e => { if (e.key === 'ArrowRight' || e.key === ' ') step(); if (e.key === 'ArrowLeft') { idx = (idx - 2 + slides.length) % slides.length; step(); } });
  // reload once an hour to shake off anything odd
  setTimeout(() => location.reload(), 3600000);
})();
</script>
</body>
</html>
